name: Build & Publish Latest APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build CraveCourier Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Production Web Bundle
        working-directory: client
        env:
          VITE_APP_NAME: CraveCourier
          VITE_API_BASE_URL: https://cravecourier-v2.onrender.com/api
          VITE_SOCKET_URL: https://cravecourier-v2.onrender.com
        run: npm run build

      - name: Sync Capacitor Android Project
        working-directory: client
        run: npx cap sync android

      - name: Build Android APK
        working-directory: client/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare CraveCourier.apk
        run: |
          cp client/android/app/build/outputs/apk/debug/app-debug.apk CraveCourier.apk

      - name: Publish to Permanent Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: CraveCourier Latest APK
          body: Automated build of CraveCourier Android APK from `${{ github.sha }}`.
          make_latest: true
          files: CraveCourier.apk
