<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#FF6B35" />
    <title>Offline | Crave Food & Grocery Delivery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Poppins:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background-color: #f8fafc;
        color: #0f172a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 28px;
        padding: 40px 24px;
        max-width: 440px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      }
      .icon-container {
        width: 80px;
        height: 80px;
        background: #fff5f0;
        border: 2px solid #ffd0bf;
        color: #ff6b35;
        border-radius: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 24px;
      }
      .brand-title {
        font-family: 'Poppins', sans-serif;
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.5px;
        color: #0f172a;
        margin-bottom: 8px;
      }
      .brand-title span {
        color: #ff6b35;
      }
      .description {
        font-size: 13px;
        color: #64748b;
        line-height: 1.6;
        margin-bottom: 28px;
      }
      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        min-height: 48px;
        background: #ff6b35;
        color: #ffffff;
        font-size: 14px;
        font-weight: 700;
        border: none;
        border-radius: 16px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(255, 107, 53, 0.35);
        transition: transform 0.2s, background 0.2s;
        text-decoration: none;
        margin-bottom: 12px;
      }
      .btn-primary:active {
        transform: scale(0.98);
        background: #e85018;
      }
      .btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 48px;
        background: #f1f5f9;
        color: #334155;
        font-size: 13px;
        font-weight: 700;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        cursor: pointer;
        text-decoration: none;
      }
      .signal-bar {
        margin-top: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 11px;
        font-weight: 600;
        color: #94a3b8;
      }
      .pulse-dot {
        width: 8px;
        height: 8px;
        background: #ef4444;
        border-radius: 50%;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div style="margin-bottom: 20px;">
        <img src="/crave-courier-pin.png" alt="Cravecourier" style="height: 72px; width: auto; display: inline-block;" />
      </div>

      <h1 class="brand-title"><span style="color: #FF541E;">Crave</span><span style="color: #0f172a;">courier</span> is Offline</h1>
      <p class="description">
        You seem to have lost your internet connection. Don't worry, your cart and previously viewed catalog items are cached safely on your device.
      </p>

      <button class="btn-primary" onclick="window.location.reload()">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
        Try Reconnecting
      </button>

      <a class="btn-secondary" href="/cart">
        View Saved Cart & Offline Items
      </a>

      <div class="signal-bar">
        <span class="pulse-dot"></span>
        Waiting for network to resume...
      </div>
    </div>
  </body>
</html>
